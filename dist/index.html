<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11273b"><meta name="description" content="Explore Kanto dans une aventure Pokémon RNG en pixel art."><title>Pokéluck — Aventure rétro</title><link rel="stylesheet" href="game.css?v=3"></head>
<body><main class="game" aria-label="Pokéluck — Terrain de jeu"><canvas id="scenery" width="480" height="375" aria-label="Décor de la zone actuelle"></canvas><div class="scene-shade"></div><div class="ambient" aria-hidden="true"><img id="wild-one" class="wild one" alt=""><img id="wild-two" class="wild two" alt=""><img id="wild-three" class="wild three" alt=""></div>
<header class="hud"><section class="trainer" aria-label="Bannière du dresseur"><button class="avatar" id="edit-profile" aria-label="Modifier mon profil"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Avatar Pikachu"></button><div class="trainer-info"><span class="overline">DRESSEUR</span><strong id="trainer-name">Dresseur</strong><span class="power">✦ <b id="power">0</b> <small>puissance</small></span></div></section><div class="location"><span class="overline">KANTO · GÉNÉRATION I</span><strong id="location-chip">Route 1</strong></div></header>
<nav class="quick-menu" aria-label="Commandes du jeu"><button id="open-menu" class="game-button" aria-haspopup="dialog"><span class="mini-ball" aria-hidden="true"></span><span>Menu</span></button><button id="open-pokemon" class="game-button"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt=""><span>Pokédex</span></button><button id="open-map" class="game-button"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/town-map.png" alt=""><span>Carte</span></button></nav>
<button id="team-shortcut" class="trainer-team" aria-label="Voir et modifier mon équipe"><span id="mini-team"></span></button>
<section class="stage" id="stage" aria-label="Tirage Pokémon"><div class="summon-ring"></div><button class="ball" id="roll" aria-label="Lancer un tirage Pokémon"><span class="ball-top"></span><span class="ball-line"></span><span class="ball-core"></span></button><button id="result" class="result" aria-label="Relancer un tirage Pokémon" hidden></button><div class="encounter-status" aria-live="polite"><strong id="result-name" hidden></strong><span id="result-details" hidden></span></div><button class="roll-caption" id="roll-cta">Clique sur la Pokéball</button><span class="sr-only" id="stage-caption">Espace pour lancer</span></section>
<section class="travel" aria-label="Choix des zones"><div class="travel-head"><div class="region"><span class="mini-ball" aria-hidden="true"></span><strong>Voyage · Kanto</strong><span class="generation">Génération I</span></div><div class="travel-controls"><button id="show-odds" class="compact-button" aria-label="Consulter les probabilités"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/amulet-coin.png" alt=""><span>Probabilités</span></button><button id="map-shortcut" class="compact-button"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/town-map.png" alt=""><span>Carte</span></button></div></div><div class="zone-list" id="zone-list"></div><div class="travel-foot"><span id="active-bonus">Tirage classique · aucun bonus</span><span class="counts"><span id="roll-count">0 tirage</span><span class="count-separator">·</span><span id="collection-count">0 / 31 découverts</span></span></div></section>
<div class="world-status"><span><i></i> Sauvegarde locale <span id="save-status" role="status"></span></span><div><a href="https://pokeapi.co/docs/v2" target="_blank" rel="noreferrer">PokéAPI</a><span>ALPHA 0.3</span><button id="fullscreen" aria-label="Activer le plein écran">⛶</button></div></div></main>
<dialog class="drawer" id="menu-drawer" aria-labelledby="menu-title"><div class="drawer-head"><h2 id="menu-title"><span class="mini-ball" aria-hidden="true"></span> Menu</h2><button class="close-button" id="close-menu" aria-label="Fermer le menu">×</button></div><nav class="drawer-nav"><button data-view="pokemon"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt=""><div><strong>Mes Pokémon</strong><small>Collection et équipe</small></div><span>›</span></button><button data-view="map"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/town-map.png" alt=""><div><strong>Carte de Kanto</strong><small>Choisir une destination</small></div><span>›</span></button><button data-view="odds"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/amulet-coin.png" alt=""><div><strong>Probabilités</strong><small>Les chances de cette zone</small></div><span>›</span></button><button data-view="history"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/vs-seeker.png" alt=""><div><strong>Dernières rencontres</strong><small>Ton historique de tirages</small></div><span>›</span></button><button data-view="settings" id="settings-shortcut"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/vs-recorder.png" alt=""><div><strong>Paramètres</strong><small>Profil et sauvegarde</small></div><span>›</span></button></nav><p class="drawer-note">Objets, améliorations et renaissances<br><span>À venir</span></p></dialog>
<dialog class="modal" id="content-dialog" aria-labelledby="modal-title"><div class="modal-head"><div><span class="overline" id="modal-kicker">TON AVENTURE</span><h2 id="modal-title">Mes Pokémon</h2></div><button class="close-button" id="close-content" aria-label="Fermer">×</button></div><div id="modal-body"></div></dialog><script type="module" src="game.js?v=3"></script></body></html>
