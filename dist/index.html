<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11273b"><meta name="app-version" content="__VERSION__"><meta name="description" content="Explore Kanto dans une aventure Pokémon RNG en pixel art."><title>Pokéluck — Aventure rétro</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap"><link rel="stylesheet" href="game.css?v=5"><link rel="stylesheet" href="layout.css?v=15"></head>
<body><main class="game" aria-label="Pokéluck — Terrain de jeu">

<!-- Cadre 2 : bannière du dresseur (nom, puissance, équipe de six) -->
<section class="banner" aria-label="Bannière du dresseur"><button class="avatar" id="edit-profile" aria-label="Modifier mon profil"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Avatar Pikachu"></button><div class="banner-info"><span class="overline">DRESSEUR</span><strong id="trainer-name">Dresseur</strong><span class="power">✦ <b id="power">0</b> <small>puissance</small></span></div><div class="zone-chip"><div class="scene-place-text"><span class="overline">KANTO · GÉNÉRATION I</span><strong id="location-chip">Route 1</strong></div><button class="index-button" id="open-zone-index" aria-haspopup="dialog" aria-label="Ouvrir l’index des Pokémon de cette zone">Index</button></div><button id="team-shortcut" class="banner-team" aria-label="Ouvrir mes Pokémon et mon équipe"><span id="mini-team"></span></button></section>

<!-- Rail de menu -->
<nav class="rail" aria-label="Menu"><button id="open-menu" class="menu-frame" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span>Menu</span></button><button class="rail-btn" data-view="pokemon" aria-label="Pokémon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg><span>Pokémon</span></button><button class="rail-btn" data-view="map" aria-label="Carte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>Carte</span></button><button class="rail-btn" data-view="odds" aria-label="Chances"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>Chances</span></button><button class="rail-btn" data-view="history" aria-label="Historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Historique</span></button><span class="rail-spacer"></span><button class="rail-btn" data-view="settings" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Réglages</span></button></nav>

<!-- Cadre 1 : lieu d'apparition des Pokémon, avec la Pokéball -->
<section class="scene" aria-label="Tirage Pokémon"><div id="scenery" role="img" aria-label="Décor de la zone actuelle"></div><div class="scene-shade"></div><div class="ambient" id="wanderers" aria-hidden="true"></div>
<div class="stage" id="stage"><div class="summon-ring"></div><button class="ball" id="roll" aria-label="Lancer un tirage Pokémon"><span class="ball-top"></span><span class="ball-line"></span><span class="ball-core"></span></button><button id="result" class="result" aria-label="Relancer un tirage Pokémon" hidden></button><div class="encounter-status" aria-live="polite"><strong id="result-name" hidden></strong><span id="result-details" hidden></span><div class="hp" id="hp" hidden><div class="hp-top"><b id="hp-name"></b><small id="hp-text"></small></div><span class="hp-track"><i id="hp-fill"></i></span></div></div><button class="roll-caption" id="roll-cta">Clique sur la Pokéball</button><span class="sr-only" id="stage-caption">Espace pour lancer</span></div>
<img class="ally" id="ally" alt="Ton Pokémon" hidden>
<div class="fighter" id="fighter" hidden><b id="fighter-name"></b><span class="hp-track"><i id="fighter-fill"></i></span><small id="fighter-text"></small><span class="xp" title="Expérience"><i id="fighter-xp"></i></span><small id="fighter-xptext"></small></div>
<div class="battle" id="battle" hidden><p class="battle-log" id="battle-log" aria-live="polite"></p><div class="moves" id="moves"></div><div class="dock-side"><button class="switch" id="switch">Équipe<small>Changer</small></button><button class="flee" id="flee">Fuir<small>Espace</small></button></div></div>
<div class="victory" id="switch-panel" hidden></div>
<div class="victory" id="victory" hidden></div>
<div class="encounter-counters"><span id="roll-count">0 tirage</span><span> · </span><span id="collection-count">0 / 31 découverts</span></div></section>

<!-- Cadre 4 : carte de Kanto avec les zones cliquables -->
<div class="bottom">
<section class="map-panel" aria-label="Voyage dans Kanto"><div class="map-panel-head"><strong><span class="mini-ball" aria-hidden="true"></span> Kanto</strong><span class="map-place" id="map-place">Route 1</span><button class="map-expand" id="expand-map" aria-label="Agrandir la carte" title="Agrandir la carte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button></div><div id="map-mount"></div><div class="map-panel-foot"><span id="active-bonus">Tirage classique · aucun bonus</span></div></section>
<!-- Équipe de six : nom et puissance -->
<section class="team-panel" aria-label="Mon équipe"><div class="team-panel-head"><strong>Mon équipe</strong><span id="team-count">0 / 6</span></div><div class="team-grid" id="team-grid"></div></section>
</div>

<div class="world-status"><span><i></i> Sauvegarde locale <span id="save-status" role="status"></span></span><div><a href="https://pokeapi.co/docs/v2" target="_blank" rel="noreferrer">PokéAPI</a><span>ALPHA 0.9</span><button id="fullscreen" aria-label="Activer le plein écran">⛶</button></div></div></main>
<dialog class="drawer" id="menu-drawer" aria-labelledby="menu-title"><div class="drawer-head"><h2 id="menu-title"><span class="mini-ball" aria-hidden="true"></span> Menu</h2><button class="close-button" id="close-menu" aria-label="Fermer le menu">×</button></div><nav class="drawer-nav"><button data-view="pokemon"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt=""><div><strong>Mes Pokémon</strong><small>Collection et équipe</small></div><span>›</span></button><button data-view="map"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/town-map.png" alt=""><div><strong>Carte de Kanto</strong><small>Choisir une destination</small></div><span>›</span></button><button data-view="odds"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/amulet-coin.png" alt=""><div><strong>Probabilités</strong><small>Les chances de cette zone</small></div><span>›</span></button><button data-view="history"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/vs-seeker.png" alt=""><div><strong>Dernières rencontres</strong><small>Ton historique de tirages</small></div><span>›</span></button><button data-view="settings" id="settings-shortcut"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/vs-recorder.png" alt=""><div><strong>Paramètres</strong><small>Profil et sauvegarde</small></div><span>›</span></button></nav><p class="drawer-note">Objets, améliorations et renaissances<br><span>À venir</span></p></dialog>
<dialog class="modal" id="content-dialog" aria-labelledby="modal-title"><div class="modal-head"><div><span class="overline" id="modal-kicker">TON AVENTURE</span><h2 id="modal-title">Mes Pokémon</h2></div><button class="close-button" id="close-content" aria-label="Fermer">×</button></div><div id="modal-body"></div></dialog><script type="module" src="game.js?v=18"></script><script src="update.js?v=1" defer></script></body></html>
